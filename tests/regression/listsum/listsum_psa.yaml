## Optimizer Block
general:
  optimizer: simulated_annealing
  code_type: listsum
  results_directory_name: output_files
  input_template: 
    apply: False
  clear_results: all_but_best

optimization:
  population_size: 15
  number_of_generations: 30
  objectives:
    list_sum:
      goal: maximize
      weight: 1.0

## Algorithm Settings
algorithm:
  coooling_schedule: lam
  secondary_cooling_schedule: exponential_decrease
  update_factor: 0.95
  perturbation_type:
    method: perturb_by_gene
    num_perturbations: 1
  buffer_size: 8

## Fuel Assembly Parts
assembly_options:
  reflectors:
    NSFA: 
      refl_type: all
      serial: None
  blankets:
