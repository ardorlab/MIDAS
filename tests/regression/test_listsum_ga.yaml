## Optimizer Block
general:
  optimizer: genetic_algorithm
  code_type: test_listsum
  results_directory_name: output_files

optimization:
  population_size: 40
  number_of_generations: 100
  objectives:
    list_sum:
      goal: maximize
      weight: 1.0

## Algorithm Settings
algorithm:
  selection:
    fitness: weighted
    method: tournament #tournament or roulette
  reproducer: standard
  mutation_type: mutate_by_gene
  mutation_rate: 0.25, 0.55

## Fuel Assembly Parts
assembly_options:
  reflectors:
    NSFA: 
      refl_type: all
      serial: None
  blankets:
