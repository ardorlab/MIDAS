## Optimizer Block
general:
  optimizer: genetic_algorithm
  code_type: traveling_salesman
  calc_type: categorical
  results_directory_name: output_files

optimization:
  population_size: 10
  number_of_generations: 20
  objectives:
    distance:
      output_index: 1
      goal: minimize
      weight: 5.0
    missed_destinations:
      output_index: 2
      goal: minimize
      weight: 35.0       

## Algorithm Settings
algorithm:
  selection:
    fitness: weighted
    method: tournament #tournament or roulette
  mutation_type: mutate_by_gene
  mutation_rate: 0.25
  crossover:
    method: uniform
    crossover_rate: 0.3


## avialble genes
gene_options:
  New_York: 
    coordinate: [0,9]
  Shanghai: 
    coordinate: [2,3]
  Paris: 
    coordinate: [11,7]
  Tokyo: 
    coordinate: [6,2]
  Istanbul: 
    coordinate: [0,6]
  Madrid: 
    coordinate: [11,13]
  Seoul: 
    coordinate: [4,9]
  London: 
    coordinate: [7,4]

## Genome
decision_variables:
  parameters:
    New_York: 
      map: &ID001 
        [1, 1, 1, 1, 1, 1, 1, 1] 
    Shanghai: 
      map: *ID001 
    Paris: 
      map: *ID001 
    Tokyo: 
      map: *ID001 
    Istanbul: 
      map: *ID001 
    Madrid: 
      map: *ID001 
    Seoul: 
      map: *ID001 
    London: 
      map: *ID001 

## Calculation Settings
optimization_data:
  chromosome_length: 8