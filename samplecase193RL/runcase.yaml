## General Settings Block
general:
  # debug_mode: True
  methodology: genetic_algorithm
  code_type: surrogate
  calc_type: multi cycle
  results_directory_name: output_files
  parcs_steps: 10,20,30,40,50,60,70,80,90,99

  retrain_steps: 10,20,30,40,50,60,70,80,90,
  # clear_results: keep_all
  keep_retraindata: no

## Optimizer Block
optimization:
  population_size: 200
  number_of_generations: 100
  solution_symmetry: quarter # octant #chromosome symmetry
  objectives:
    max_boron:
      goal: less_than_target
      target: 1750
      #target: 1235
      weight: 14.0
    PinPowerPeaking:
      goal: less_than_target
      weight: 5000.0 
      target: 2.5
      #target: 1.995
    FDeltaH:
      goal: less_than_target
      target: 1.65
      #target: 1.406
      weight: 5000.0     
    cycle_length:
      goal: maximize
      weight: 1.00

## Algorithm Settings
algorithm:
  selection:
    fitness: weighted
    method: tournament #tournament or roulette
  reproducer: standard
  # mutation_type: mutate_by_gene
  mutation_type: mutate_by_scramble
  mutation_rate: 0.1 ## no mutation as no possible for mutation gene
  elites: 25
  crossover:
    method: two_point
# algorithm:

#   selection:

#     method: ktournament

#     k: 8

