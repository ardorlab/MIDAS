## Optimizer Block
general:
  optimizer: bayesian_optimization
  code_type: serpent
  calc_type: continuous_variable
  #Possible types: continuous_variable, single_cycle_loading_pattern, equilibrium_loading_pattern
  results_directory_name: output_files
  input_template: 
      apply: True
      loc: "/home/cahowar9/rdfmg/MIDAS/MIDAS/samples/bayes_opt/serptemptest"
optimization:
  population_size: 1
  number_of_generations: 2
  objectives:
    FDeltaH:
      goal: less_than_target
      target: 1.48
      weight: 800.0     
    cycle_length:
      goal: maximize
      weight: 1.0
    cost_fuelcycle:
      goal: minimize
      weight: 0.000001
    total_mass:
      goal: less_than_target
      target: 50000
      weight: 1.0
    doppler_temperature_coefficient:
      goal: less_than_target
      target: 0
      weight: 100.0

## Algorithm Settings
algorithm:
  acquisition_function: lcb
  exploration_exploitation_factor: 1.96

serpent_data:
  particles_per_history: 500
  power_peaking_detectors: 'ppw'
  active_cycles: 500
  inactive_cycles: 50
  mass_materials: all
  depletion_settings:
    apply: True
    depletion_steps: [1500, 2000, 2500]
    depletion_units: days
    mpi_ranks: 5
    omp_threads: 2
    particles_per_history: 500
    active_cycles: 500
    inactive_cycles: 50
  mpi_ranks: 5
  omp_threads: 2
  power: 5000
  xs_library_path: "/usr/local/usrapps/rdfmg/serpent/lib/xs/s2v0_endfb71.xsdata"
  decay_library_path: "/usr/local/usrapps/rdfmg/serpent/lib/decay/s2v0_endfb71.dec"
  fission_yield_library_path: "/usr/local/usrapps/rdfmg/serpent/lib/decay/s2v0_endfb71.nfy"

## Genome
decision_variables:
  # parameters used to fill each chromosome.
  parameters:
    pin_pitch:
      continuous_range: [1.25,1.75]
      index: 0
    enrichment:
      discrete_range: [1.8,3]
      increment: 0.05
      index: 1
    fuel_pin_radius:
      continuous_range: [0.5,2.3]
      index: 2
    fuel_height:
      continuous_range: [15, 30]
      index: 3