## Optimizer Block
general:
  optimizer: tabu_search
  code_type: PARCS343_axial
  calc_type: axial_zones
  results_directory_name: output_files
  input_template: 
    apply: TRUE
    loc: './template.inp' 
  clear_results: all_but_best

optimization:
  population_size: 2
  number_of_generations: 1000
  objectives:
    lhgr: 
      output_index: 12
      goal: less_than_target 
      weight: 250
      target: 13.4 
      linear_power: 4.0359 
    chfr:
      output_index: 7
      goal: greater_than_target
      weight: 250.0
      target: 1.9    

## Algorithm Settings
algorithm:
  construct_neighbors: 
    method: flip
    num_flips: 1
  num_tabu: 10
  tabu_bands: 0.075 # for continous variable optimization
  aspiration: 
    method: improved_best


